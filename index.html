<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GloryPad</title>
    <meta name="theme-color" content="#090a0d" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/glorypad-icon-512.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/glorypad-icon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="site.webmanifest?v=2" />
    <link rel="stylesheet" href="styles.css?v=glorypad-20" />
  </head>
  <body>
    <main>
      <section class="cover-screen" id="homeScreen" aria-label="Entrada do app" data-i18n-aria="appEntry">
        <div class="ambient-field" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="cover-stage">
          <div class="glory-logo" aria-label="Logo GloryPad">
            <span class="glory-bars" aria-hidden="true">
              <i></i>
              <i></i>
              <i></i>
              <i></i>
              <i></i>
              <i></i>
              <i></i>
            </span>
            <strong>GLORY<span>PAD</span></strong>
            <small><span></span>SOUND THAT LIFTS<span></span></small>
          </div>
        </div>
      </section>

      <section class="app-shell is-hidden" id="padsScreen" aria-label="GloryPad">
        <div class="phone-shell">
          <header class="app-topbar">
            <button class="app-brand" id="topHomeButton" type="button" aria-label="Voltar para entrada" data-i18n-aria="backToEntry">
              <span class="mini-wave" aria-hidden="true">
                <i></i>
                <i></i>
                <i></i>
                <i></i>
                <i></i>
              </span>
              <span>
                <strong>GloryPad</strong>
                <small id="miniLibraryName">Ambient</small>
              </span>
            </button>
          </header>

          <nav class="mode-tabs" aria-label="Modos do app" data-i18n-aria="appModes">
            <button class="mode-tab is-active" type="button" data-view="live" data-i18n="live">Ao Vivo</button>
            <button class="mode-tab" type="button" data-view="sounds" data-i18n="sounds">Sons</button>
            <button class="mode-tab" type="button" data-view="tuner" data-i18n="tuner">Afinador</button>
          </nav>

          <section class="view-panel live-view" id="liveView" aria-label="Pads ao vivo" data-i18n-aria="livePads">
            <div class="active-strip">
              <div class="pulse-ring" id="pulseRing" aria-hidden="true"></div>
              <div>
                <p data-i18n="activePad">Pad ativo</p>
                <strong id="activeNote">Nenhum</strong>
              </div>
            </div>

            <section class="pads-grid" id="padsGrid" aria-label="Pads das 12 tonalidades" data-i18n-aria="twelveKeys"></section>
          </section>

          <section class="view-panel sounds-view is-hidden" id="soundsView" aria-label="Lista de sons" data-i18n-aria="soundList">
            <div class="sounds-heading">
              <h2 data-i18n="sounds">Sons</h2>
              <button class="icon-text chevron-button" type="button" id="backToLiveButton" aria-label="Voltar ao vivo" data-i18n-aria="backToLive">
                <span aria-hidden="true"></span>
              </button>
            </div>

            <div class="sound-section-label" data-i18n="collections">Coleções</div>
            <div class="library-list" id="libraryList"></div>

            <div class="sounds-controls" id="configPanel">
              <label class="volume-control">
                <span class="setting-label" data-i18n="volume">Volume</span>
                <input id="volume" type="range" min="0" max="100" value="75" />
              </label>

              <label class="language-compact">
                <span data-i18n="language">Idioma</span>
                <select id="languageSelect" aria-label="Idioma" data-i18n-aria="language">
                  <option value="pt-BR">Português</option>
                  <option value="en">English</option>
                </select>
              </label>
            </div>

            <select class="sr-only" id="toneSelect" aria-label="Tom / relativa" data-i18n-aria="keyRelative"></select>
          </section>

          <section class="view-panel tuner-view is-hidden" id="tunerView" aria-label="Afinador" data-i18n-aria="tuner">
            <div class="tuner-scroll">
              <div class="tuner-heading">
                <div>
                  <p data-i18n="tunerTool">Ferramenta</p>
                  <h2 data-i18n="tuner">Afinador</h2>
                </div>
                <div class="tuner-status-dot" id="tunerStatusDot" aria-hidden="true"></div>
              </div>

              <section class="instrument-picker" aria-label="Instrumento" data-i18n-aria="instrument">
                <div class="instrument-picker-head">
                  <span data-i18n="instrument">Instrumento</span>
                  <small data-i18n="selectInstrument">Selecione o instrumento</small>
                </div>
                <select class="sr-only" id="instrumentSelect" aria-label="Instrumento" data-i18n-aria="instrument"></select>
                <div class="instrument-card-list" id="instrumentCards"></div>
              </section>

              <div class="tuner-stage" id="tunerStage">
                <div class="tuner-meter" aria-label="Medidor de cents" data-i18n-aria="centsMeter">
                  <div class="tuner-scale">
                    <span>-50</span>
                    <span>-20</span>
                    <span>0</span>
                    <span>+20</span>
                    <span>+50</span>
                  </div>
                  <div class="tuner-track">
                    <span class="tuner-zone"></span>
                    <i class="tuner-center"></i>
                    <b class="tuner-needle" id="tunerNeedle"></b>
                  </div>
                  <div class="tuner-directions" aria-hidden="true">
                    <span data-i18n="flatLabel">b Baixo</span>
                    <span data-i18n="sharpLabel"># Agudo</span>
                  </div>
                </div>

                <div class="tuner-readout">
                  <p class="tuner-prompt" id="tunerPrompt" data-i18n="playString">Toque uma corda</p>
                  <strong class="tuner-note" id="tunerNote">--</strong>
                  <span class="tuner-note-detail" id="tunerNoteDetail">--</span>
                  <span class="tuner-frequency" id="tunerFrequency">-- Hz</span>
                  <strong class="tuner-cents" id="tunerCents">0 cents</strong>
                </div>
              </div>

              <div class="tuner-strings" id="tunerStrings" aria-label="Cordas do instrumento" data-i18n-aria="instrumentStrings"></div>

              <p class="tuner-privacy" data-i18n="tunerPrivacy">
                O audio do microfone e processado localmente e nunca e gravado ou enviado.
              </p>
            </div>
          </section>

          <footer class="bottom-bar" aria-label="Controles inferiores">
            <span class="footer-signature">ColliDev</span>
          </footer>
        </div>
      </section>
    </main>

    <script src="tuner-core.js?v=glorypad-1"></script>
    <script src="tuner-audio.js?v=glorypad-1"></script>
    <script src="app.js?v=glorypad-21"></script>
  </body>
</html>
