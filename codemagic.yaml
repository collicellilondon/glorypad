workflows:
  ios-app-store:
    name: GloryPad iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: GloryPad_app_store_connect
    environment:
      xcode: latest
      node: latest
      npm: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sergiocollicelli.glorypad
      vars:
        APP_NAME: GloryPad
        BUNDLE_ID: com.sergiocollicelli.glorypad
        MARKETING_VERSION: "1.0"
        BUILD_NUMBER: "1"
        IOS_DEPLOYMENT_TARGET: "15.0"
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    cache:
      cache_paths:
        - $HOME/.npm
        - ios/App/Pods
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build packaged web app
        script: npm run build
      - name: Create iOS platform if needed
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios --packagemanager SPM
          else
            echo "iOS platform already exists."
          fi
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Configure iOS metadata
        script: sh scripts/configure-ios-project.sh
      - name: Apply iOS App Icon
        script: sh scripts/apply-ios-app-icon.sh
      - name: Install CocoaPods
        script: |
          echo "Inspecting generated iOS dependency manager files..."
          find "$CM_BUILD_DIR/ios" -maxdepth 4 \( -name Podfile -o -name Package.swift -o -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print || true

          PODFILE_PATH="$(find "$CM_BUILD_DIR/ios" -name Podfile -print -quit || true)"

          if [ -n "$PODFILE_PATH" ]; then
            PODFILE_DIR="$(dirname "$PODFILE_PATH")"
            echo "Podfile found at $PODFILE_PATH"
            echo "Installing CocoaPods from $PODFILE_DIR"
            cd "$PODFILE_DIR"
            pod install --repo-update
          else
            echo "No Podfile found. Capacitor 8 generated an SPM-based iOS project."
            if [ -f "$CM_BUILD_DIR/ios/App/CapApp-SPM/Package.swift" ]; then
              echo "SPM package found at $CM_BUILD_DIR/ios/App/CapApp-SPM/Package.swift"
            fi
            echo "Skipping CocoaPods install."
          fi
      - name: Set up code signing settings
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          ARCHIVE_DIR="$CM_BUILD_DIR/build/ios/archive"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          ARCHIVE_PATH="$ARCHIVE_DIR/GloryPad.xcarchive"
          EXPORT_OPTIONS_PLIST="$HOME/export_options.plist"

          mkdir -p "$ARCHIVE_DIR" "$IPA_DIR"

          if [ -d "$CM_BUILD_DIR/$XCODE_WORKSPACE" ]; then
            echo "Archiving from workspace $CM_BUILD_DIR/$XCODE_WORKSPACE"
            xcodebuild -showBuildSettings \
              -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release | grep -E "PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER" || true

            xcodebuild archive \
              -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH"
          elif [ -d "$CM_BUILD_DIR/$XCODE_PROJECT" ]; then
            echo "Archiving from project $CM_BUILD_DIR/$XCODE_PROJECT"
            xcodebuild -showBuildSettings \
              -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release | grep -E "PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER" || true

            xcodebuild archive \
              -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH"
          else
            echo "No Xcode workspace or project found."
            find "$CM_BUILD_DIR/ios" -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print || true
            exit 1
          fi

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "Archive was not created at $ARCHIVE_PATH"
            exit 1
          fi

          if [ ! -f "$EXPORT_OPTIONS_PLIST" ]; then
            echo "Export options plist was not created by xcode-project use-profiles at $EXPORT_OPTIONS_PLIST"
            find "$HOME" -maxdepth 2 -name "*export*plist" -print || true
            exit 1
          fi

          echo "Exporting archive $ARCHIVE_PATH to $IPA_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -exportPath "$IPA_DIR"

          echo "IPA files produced:"
          find "$IPA_DIR" -name "*.ipa" -print

          IPA_PATH="$(find "$IPA_DIR" -name "*.ipa" -print -quit || true)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was produced in $IPA_DIR"
            exit 1
          fi

          echo "Signed IPA ready for publishing: $IPA_PATH"
      - name: Verify IPA artifact
        script: |
          echo "Searching for IPA artifacts before publishing..."
          find "$CM_BUILD_DIR" -name "*.ipa" -print

          IPA_PATH="$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" -print -quit || true)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found at $CM_BUILD_DIR/build/ios/ipa. Failing build before Publishing."
            exit 1
          fi

          echo "Publishing will use IPA: $IPA_PATH"
    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
