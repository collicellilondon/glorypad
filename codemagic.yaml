workflows:
  ios-app-store:
    name: GloryPad iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: GloryPad_app_store_connect
    environment:
      xcode: latest
      node: latest
      npm: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sergiocollicelli.glorypad
      vars:
        APP_NAME: GloryPad
        BUNDLE_ID: com.sergiocollicelli.glorypad
        MARKETING_VERSION: "1.0"
        BUILD_NUMBER: "1"
        IOS_DEPLOYMENT_TARGET: "15.0"
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    cache:
      cache_paths:
        - $HOME/.npm
        - ios/App/Pods
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build packaged web app
        script: npm run build
      - name: Create iOS platform if needed
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists."
          fi
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Configure iOS metadata
        script: sh scripts/configure-ios-project.sh
      - name: Apply iOS App Icon
        script: sh scripts/apply-ios-app-icon.sh
      - name: Install CocoaPods
        script: |
          PODFILE_DIR="$CM_BUILD_DIR/ios/App"
          PODFILE_PATH="$PODFILE_DIR/Podfile"

          if [ ! -f "$PODFILE_PATH" ]; then
            echo "Expected Podfile at $PODFILE_PATH, but it was not found."
            find "$CM_BUILD_DIR/ios" -name Podfile -print || true
            exit 1
          fi

          echo "Installing CocoaPods from $PODFILE_PATH"
          cd "$PODFILE_DIR"
          pod install --repo-update
      - name: Set up code signing settings
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
